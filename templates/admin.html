<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
            font-family:Arial;
        }

        .main-box{
            background:white;
            padding:30px;
            border-radius:15px;
            margin-top:40px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.1);
        }

        .card-box{
            padding:25px;
            border-radius:15px;
            color:white;
            text-align:center;
            margin-bottom:20px;
        }

        .users{
            background:#0d6efd;
        }

        .analysis{
            background:#198754;
        }

        h1{
            margin-bottom:30px;
            text-align:center;
            font-weight:bold;
        }

        table{
            margin-top:30px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="main-box">

        <h1>Admin Dashboard</h1>

        <div class="row">

            <div class="col-md-6">

                <div class="card-box users">

                    <h2>Total Users</h2>

                    <h1>
                        {{ total_users }}
                    </h1>

                </div>

            </div>

            <div class="col-md-6">

                <div class="card-box analysis">

                    <h2>Total Analysis</h2>

                    <h1>
                        {{ total_analysis }}
                    </h1>

                </div>

            </div>

        </div>
<div class="text-center mt-4">

    <h3>
        ATS Analytics Chart
    </h3>

    <img
    src="{{ url_for('static', filename='chart.png') }}"
    class="img-fluid rounded shadow">

</div>
        <h3 class="mt-4">
            User Analysis History
        </h3>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Username</th>
                    <th>ATS Score</th>
                    <th>Skills</th>

                </tr>

            </thead>

            <tbody>

                {% for item in all_analysis %}

                <tr>

                    <td>{{ item.id }}</td>

                    <td>{{ item.username }}</td>

                    <td>{{ item.score }}%</td>

                    <td>{{ item.skills }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
