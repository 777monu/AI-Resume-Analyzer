<!DOCTYPE html>
<html>

<head>

    <title>AI Resume Analyzer</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>AI Resume Analyzer</h1>

        <form method="POST"
        enctype="multipart/form-data">

           <input type="file"
             name="resume"
                accept=".pdf,.docx"
                required>

            <textarea
            name="job_description"
            rows="10"
            placeholder="Paste Job Description"
            required></textarea>
 <input
    type="email"
    name="email"
    placeholder="Enter Email Address (Optional)"
>
            <button type="submit">
                Analyze Resume
            </button>

        </form>

    </div>

</body>

</html>
