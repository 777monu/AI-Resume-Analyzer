<!DOCTYPE html>
<html>

<head>

    <title>AI Resume Analyzer</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
            font-family:Arial;
        }

        .main-box{
            background:white;
            padding:40px;
            border-radius:15px;
            margin-top:50px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            font-weight:bold;
        }

        .btn-custom{
            width:100%;
            padding:12px;
            font-size:18px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="main-box">

                <h1>AI Resume Analyzer</h1>

                <form method="POST" enctype="multipart/form-data">

                    <div class="mb-3">

                        <label class="form-label">
                            Upload Resume
                        </label>

                        <input
                        type="file"
                        name="resume"
                        class="form-control"
                        required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Job Description
                        </label>

                        <textarea
                        name="job_description"
                        class="form-control"
                        rows="8"
                        required></textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email Report
                        </label>

                        <input
                        type="email"
                        name="email"
                        class="form-control">

                    </div>

                    <button
                    type="submit"
                    class="btn btn-primary btn-custom">

                        Analyze Resume

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
